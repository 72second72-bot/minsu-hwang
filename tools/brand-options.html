<!doctype html>
<!-- 머리 막대 왼쪽 로고 시안 비교용 (배포 안 됨). 도형 세 가지 (방위표 시안은 어색하다고 하셔서 11-27 교체) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  body { margin: 0; padding: 24px; width: 1000px; background: #eef2f6; font-family: "Pretendard Variable", Pretendard, sans-serif; }
  .row { margin-bottom: 26px; }
  .head { display: flex; align-items: center; gap: 18px; margin: 0 0 10px 4px; }
  .lab { font-size: 18px; font-weight: 700; color: #0a1f35; margin: 0; width: 330px; }
  .lab small { display: block; font-weight: 500; color: #5b6b7c; margin-top: 4px; font-size: 14px; }
  .tile { width: 96px; height: 96px; border-radius: 18px; display: grid; place-items: center; }
  .tile svg { width: 72px; height: 72px; }
  .dark { background: #0a1f35; }
  .fav { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #d5dde6; border-radius: 10px 10px 0 0; padding: 8px 14px; font-size: 13px; color: #333; }
  .fav span.ic { width: 18px; height: 18px; border-radius: 4px; background: #0f2f4d; display: grid; place-items: center; }
  .fav span.ic svg { width: 15px; height: 15px; }
  .bar {
    height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 24px; border-radius: 12px; overflow: hidden;
    background: linear-gradient(180deg, #0f2f4d, #0a1f35); color: #fff; position: relative;
  }
  .bar > svg { width: 32px; height: 32px; }
  .nav { margin-left: auto; display: flex; gap: 4px; font-size: 15px; font-weight: 600; }
  .nav span { padding: 6px 12px; border-radius: 999px; color: rgba(255,255,255,.85); }
  .moon { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); display: grid; place-items: center; }
  .moon svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 1. 궤도: 첫 화면의 엇갈린 타원 두 개 + 가운데 주황 점 -->
    <symbol id="l1" viewBox="0 0 32 32">
      <ellipse cx="16" cy="16" rx="14" ry="5.2" transform="rotate(-18 16 16)" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.5"/>
      <ellipse cx="16" cy="16" rx="10.4" ry="13.2" transform="rotate(24 16 16)" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="3.6" fill="#f5a524"/>
    </symbol>
    <!-- 2. 고리 + 점: 고리 하나에 주황 점이 걸린 모양 -->
    <symbol id="l2" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="11.5" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2"/>
      <circle cx="24.1" cy="7.9" r="4" fill="#f5a524" stroke="#0a1f35" stroke-width="2"/>
    </symbol>
    <!-- 3. 도시 블록: 길로 나뉜 네 칸, 한 칸만 주황 -->
    <symbol id="l3" viewBox="0 0 32 32">
      <rect x="4" y="4" width="10.5" height="10.5" rx="2.2" fill="rgba(255,255,255,.88)"/>
      <rect x="17.5" y="4" width="10.5" height="10.5" rx="2.2" fill="#f5a524"/>
      <rect x="4" y="17.5" width="10.5" height="10.5" rx="2.2" fill="rgba(255,255,255,.88)"/>
      <rect x="17.5" y="17.5" width="10.5" height="10.5" rx="2.2" fill="none" stroke="rgba(255,255,255,.88)" stroke-width="1.6"/>
    </symbol>
  </defs>
</svg>

<template id="nav">
  <div class="nav"><span>소개</span><span>수행 과업</span><span>작품</span><span>연구</span><span>연락</span></div>
  <div class="moon"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></div>
</template>

<div class="row" data-l="l1"><div class="head"><p class="lab">1. 궤도<small>첫 화면 사진 뒤의 엇갈린 타원 두 개를 줄인 모양. 홈페이지와 한 벌</small></p></div></div>
<div class="row" data-l="l2"><div class="head"><p class="lab">2. 고리 + 점<small>고리 하나에 주황 점. 가장 단순함</small></p></div></div>
<div class="row" data-l="l3"><div class="head"><p class="lab">3. 도시 블록<small>길로 나뉜 네 칸 중 한 칸만 주황. 도시계획 느낌</small></p></div></div>

<script>
  var t = document.getElementById('nav');
  document.querySelectorAll('.row').forEach(function (r) {
    var id = r.dataset.l, use = '<svg viewBox="0 0 32 32"><use href="#' + id + '"/></svg>';
    var h = r.querySelector('.head');
    h.insertAdjacentHTML('beforeend', '<div class="tile dark">' + use + '</div>' +
      '<div class="fav"><span class="ic">' + use + '</span>황민수 | 도시계획가 &nbsp;×</div>');
    var bar = document.createElement('div'); bar.className = 'bar'; bar.innerHTML = use;
    bar.appendChild(t.content.cloneNode(true)); r.appendChild(bar);
  });
</script>
</body>
</html>
